# Opt-in names for macros already provided by the printer's Klipper config.
# This file documents hooks; it does not install or invoke any macro.
[qidi_hooks]
purge_macro = KAMP_PURGE
park_macro = SMART_PARK
z_adjust_macro = Z_TILT_ADJUST
screw_tilt_macro = SCREWS_TILT_CALCULATE
bed_mesh_macro = BED_MESH_CALIBRATE
fan_macro = SET_FAN_SPEED
confirmation_required = true
require_homed_state = true
soft_limits_required = true

# Optional local watcher integration. Keep disabled until independently tested.
[spaghetti_watcher]
enabled = false
command =
pause_macro = PAUSE
alert_webhook =
webhook_token =

[rear_waste_chute]
# Required: fill these from a measured, printer-specific calibration.
enabled = false
x =
y =
park_z =
clearance_z =
rear_y =
corner_margin =
purge_macro = PURGE_FILAMENT
confirmation_required = true
require_homed_state = true
require_soft_limits = true
