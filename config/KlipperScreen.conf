[main]
language: en
theme: material-darker
font_size: large
show_cursor: False
confirm_estop: True
use_dpms: False
screen_blanking: off
screen_blanking_printing: off
default_printer: QIDI Q2

[printer QIDI Q2]
moonraker_host: 127.0.0.1
moonraker_port: 7125
titlebar_items: chamber
z_babystep_values: 0.01, 0.05
extrude_distances: 5, 10, 25, 50
extrude_speeds: 1, 2, 5, 10
move_distances: 0.1, 1, 10, 50
confirm_estop: True
# Advanced QIDI hooks are opt-in and must be detected before their buttons are
# shown. Every motion/heating macro requires an explicit confirmation dialog.
# See config/q2-feature-hooks.conf for names and safe prerequisites.

# Upstream KlipperScreen exposes movement, homing, temperature, fan, print
# state, and extrusion panels only when their Moonraker objects are present.
# The Q2 feature probe documents which controls are safe to expose.
