# Declarative, opt-in limits and hooks. The installer does not apply this file
# to Klipper automatically; copy values only after backing up printer_data.
[speed_limits]
print_min = 25
print_max = 100
travel_min = 10
travel_max = 300
jog_min = 0.1
jog_max = 50

[bed_mesh]
tolerance_mm = 0.08
stale_after_hours = 24

[smart_level]
level_macro = Z_TILT_ADJUST
mesh_macro = BED_MESH_CALIBRATE
confirmation_required = true

[camera_watcher]
enabled = false
watcher_command =
pause_macro = PAUSE
home_assistant_webhook =
webhook_token =

[bridge_authorization]
pairing_ttl_seconds = 300
challenge_ttl_seconds = 60
max_pairing_failures = 5
status_requires_pairing = true
sensitive_actions_require_printer_confirmation = true
